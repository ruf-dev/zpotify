name: release-minor
run-name: RELEASE MINOR
on:
  workflow_dispatch:

concurrency:
  group: release

jobs:
  resolve:
    if: github.ref == 'refs/heads/master'
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    outputs:
      rc: ${{ steps.tags.outputs.rc }}
      release: ${{ steps.tags.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve tags
        id: tags
        run: |
          git fetch --tags --force
          RC=$(git tag --points-at "$GITHUB_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-rc$' | head -1 || true)
          if [ -z "$RC" ]; then
            echo "::error::no rc tag on $GITHUB_SHA - wait for the master push workflow to finish"
            exit 1
          fi
          RELEASE=$(sh .github/scripts/next-version.sh release)
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

  e2e:
    if: github.ref == 'refs/heads/master'
    needs:
      - resolve
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start e2e environment
        run: make setup-e2e-env

      - name: Test
        run: go test ./tests/...

  release-minor:
    if: github.ref == 'refs/heads/master'
    needs:
      - resolve
      - e2e
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    permissions:
      contents: write
    steps:
      - name: Setup buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: redsockruf
          password: ${{ secrets.REGISTRY_PWD }}

      # release_image's promote mode only moves :latest, so retag directly.
      - name: Promote rc image
        env:
          RC: ${{ needs.resolve.outputs.rc }}
          RELEASE: ${{ needs.resolve.outputs.release }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
        run: |
          IMAGE=${IMAGE_NAME:-$(echo "redsockruf/${GITHUB_REPOSITORY#*/}" | tr '[:upper:]' '[:lower:]')}
          docker buildx imagetools create --tag "$IMAGE:$RELEASE" --tag "$IMAGE:latest" "$IMAGE:$RC"

      - name: Create release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.release }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
