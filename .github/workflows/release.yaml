name: master-actions
run-name: RELEASE
on:
  push:
    branches:
      - "master"

concurrency:
  group: release

jobs:
  unit-test:
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test $(go list ./... | grep -v /tests)

  image-build:
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    needs:
      - unit-test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ hashFiles('**/Dockerfile', '**/go.sum', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-

      - name: build
        uses: RedSockActions/release_image@v1.0.40
        with:
          DRYRUN: true
          REGISTRY_USER: redsockruf
          REGISTRY_PWD: ${{ secrets.REGISTRY_PWD }}
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}

      - name: Move new cache
        run: |
          if [ -d "/tmp/.buildx-cache-new" ]; then
            rm -rf /tmp/.buildx-cache
            mv /tmp/.buildx-cache-new /tmp/.buildx-cache
          else
            echo "No new buildx cache generated."
          fi

  # release_image reads the image version from the latest git tag, so the tag must exist before the image build.
  tag-release:
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    needs:
      - unit-test
      - image-build
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.next-tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve rc tag
        id: next-tag
        run: |
          git fetch --tags --force
          TAG=$(sh .github/scripts/next-version.sh rc)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release and tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: true

  docker-registry-release:
    # A release candidate is never tagged :latest - release-minor promotes it.
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    needs:
      - tag-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.ref_name }}-${{ hashFiles('**/Dockerfile', '**/go.sum', '**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ github.ref_name }}-
            ${{ runner.os }}-buildx-

      - name: Release image
        uses: RedSockActions/release_image@v1.0.40
        with:
          REGISTRY_USER: redsockruf
          REGISTRY_PWD: ${{ secrets.REGISTRY_PWD }}
          DISABLE_CHECKOUT: true
          REGISTRY_URL: ${{ vars.REGISTRY_URL }}
          IMAGE_NAME: ${{ vars.IMAGE_NAME }}
          TAG_LATEST: "false"
