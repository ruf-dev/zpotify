version: "2"
sql:
  - engine: "postgresql"
    queries:
      - "internal/storage/pg/queries/*.sql"
    schema:
      - "migrations/*.sql"
    gen:
      go:
        package: "querier"
        out: "internal/storage/pg/generated"
        sql_package: "database/sql"
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
