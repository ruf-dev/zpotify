app_info:
  name: go.zpotify.ru/zpotify
  version: v0.0.3
  startup_duration: 10s
data_sources:
  - resource_name: postgres
    migrations_folder: ../migrations
    host: localhost
    port: 15433
    user: zpotify
    pwd: ""
    name: zpotify_e2e
    ssl_mode: disable
servers:
  18087:
    /{GRPC}:
      module: go.zpotify.ru/zpotify
      gateway: /api
    name: MASTER
environment:
  - name: debug_auth
    type: bool
    value: false
  - name: enable_health_probes
    type: bool
    value: true
  - name: public_base_url
    type: string
    value: http://localhost:18087
  - name: storage_secrets_key
    type: string
    value: zpotify-e2e-storage-secrets-key-0123456789
  - name: telegram_token
    type: string
    value: ""
  - name: local_storage_path
    type: string
    value: ./data
  - name: torrent_download_dir
    type: string
    value: ./data/torrents
  - name: torrent_listen_port
    type: int
    value: 42169
  - name: torrent_metadata_timeout_seconds
    type: int
    value: 5
  - name: prowlarr_url
    type: string
    value: ""
  - name: prowlarr_api_key
    type: string
    value: ""
  - name: log_format
    type: string
    enum: [JSON, TEXT]
    value: TEXT
  - name: log_level
    type: string
    enum: [Trace, Debug, Info, Warn, Error, Fatal, Panic]
    value: Info
