app_info:
  name: go.zpotify.ru/zpotify
  version: v0.0.3
  startup_duration: 10s
data_sources:
  - resource_name: postgres
    migrations_folder: ../migrations
    host: localhost
    port: 15432
    user: zpotify
    pwd: ""
    name: zpotify_db
    ssl_mode: disable
servers:
  80:
    /{GRPC}:
      module: go.zpotify.ru/zpotify
      gateway: /api
environment:
  - name: local_storage_path
    type: string
    value: ./data
  - name: torrent_download_dir
    type: string
    value: ./data/torrents
  - name: torrent_listen_port
    type: int
    value: 42169
  - name: log_format
    type: string
    enum: [JSON, TEXT]
    value: TEXT
  - name: log_level
    type: string
    enum: [Trace, Debug, Info, Warn, Error, Fatal, Panic]
    value: Info
