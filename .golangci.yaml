version: "2"

run:
  timeout: 5m
  issues-exit-code: 42

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  default: none
  settings:
    depguard:
      rules:
        no-direct-zerolog-log:
          list-mode: lax
          files:
            - "!**/internal/log/**"
            - "!**/internal/utils/closer.go"
          deny:
            - pkg: "github.com/rs/zerolog/log"
              desc: "use go.zpotify.ru/zpotify/internal/log instead"
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable:
        - shadow
    varnamelen:
      max-distance: 25
      min-name-length: 2
      ignore-type-assert-ok: true
      check-type-param: true
      ignore-chan-recv-ok: true
  enable:
    - varnamelen
    - govet

    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errname
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - noinlineerr
    - goconst
    - godot
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - grouper
    - importas
    - ineffassign
    - loggercheck
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nolintlint
    - nosprintfhostport
    - predeclared
    - promlinter
    - reassign
    - rowserrcheck
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "SA9003:"
      - linters:
          - lll
        source: "^//go:generate "
    paths:
      - configs
      - node_modules
      - pkg/client/ZpotifyUI/node_modules

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - configs
      - node_modules
      - pkg/client/ZpotifyUI/node_modules
