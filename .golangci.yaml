version: "2"

run:
  timeout: 5m
  issues-exit-code: 42

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  default: none
  settings:
    depguard:
      rules:
        no-direct-zerolog-log:
          list-mode: lax
          files:
            - "!**/internal/log/**"
            - "!**/internal/utils/closer.go"
          deny:
            - pkg: "github.com/rs/zerolog/log"
              desc: "use go.zpotify.ru/zpotify/internal/log instead"
    exhaustive:
      default-signifies-exhaustive: true
    govet:
      enable:
        - shadow
    varnamelen:
      max-distance: 25
      min-name-length: 2
      ignore-type-assert-ok: true
      check-type-param: true
      ignore-chan-recv-ok: true
  enable:
    - varnamelen
    - govet

    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - decorder
    - dogsled
    - dupword
    - durationcheck
    - errcheck
    - errname
    - exhaustive
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - noinlineerr
    - goconst
    - godot
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - grouper
    - importas
    - ineffassign
    - loggercheck
    - makezero
    - misspell
    - nakedret
    - nilerr
#TODO
#    - noctx
    - nolintlint
    - nosprintfhostport
#TODO
#    - paralleltest
    - predeclared
    - promlinter
    - reassign
    - rowserrcheck
    - staticcheck
    - testableexamples
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace

    # TODO: these are high-noise/style linters with large existing backlogs
    # (tens of findings each across the codebase). Re-enable one at a time
    # and clean up incrementally instead of blocking CI on a big-bang fix.
    # - cyclop
    # - dupl
    # - err113
    # - errorlint
    # - gochecknoglobals
    # - gocognit
    # - gocritic
    # - gocyclo
    # - gosec
    # - ireturn
    # - lll
    # - maintidx
    # - mnd
    # - nestif
    # - nilnil
    # - nlreturn
    # - prealloc
    # - revive
    # - tagliatelle
    # - wrapcheck
    # - wsl

    # TODO: containedctx flags Provider/Task structs that intentionally hold a
    # ctx to control a long-running worker's lifecycle (pgqueue, sessions_gc);
    # fixing means reworking those abstractions to pass ctx per-call instead.
    # - containedctx

    # TODO: interfacebloat flags Storage/PlaylistStorage/PlaylistService (11-19
    # methods each); splitting them into smaller interfaces is a real design
    # change, not a one-line fix.
    # - interfacebloat

    # TODO: godox just flags the ~15 pre-existing TODO/FIXME comments already
    # in the codebase (not new problems); re-enable once those are triaged.
    # - godox

    # TODO: depguard (no-direct-zerolog-log) currently flags 20 pre-existing
    # files importing zerolog/log directly instead of internal/log. Fixing
    # this is a real migration (several call sites, e.g. cmd/service/main.go
    # and internal/clients/sqldb/conn.go, have no context.Context available
    # to pass to internal/log's ctx-based API), not a one-line fix. The
    # settings block above is left in place for when that migration happens.
    # - depguard
  exclusions:
    rules:
      - linters:
          - staticcheck
        text: "SA9003:"
      - linters:
          - lll
        source: "^//go:generate "
    paths:
      - configs
      - node_modules
      - pkg/web/ZpotifyUI/node_modules

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - configs
      - node_modules
      - pkg/web/ZpotifyUI/node_modules
