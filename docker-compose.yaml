services:
  db:
    image: postgres:18
    container_name: zpotify_db
    environment:
      POSTGRES_USER: zpotify
      POSTGRES_PASSWORD:
      POSTGRES_DB: zpotify_db
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - '15432:5432'
    volumes:
      - ./data/pg:/var/lib/postgresql

  nginx:
    image: nginx:1.31.2
    container_name: zpotify_webserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '8085:8085'
    volumes:
      - ./data/angie:/data/nginx
      - ./.verv/template/local-ingress.conf:/etc/nginx/nginx.conf:ro

  test-garage:
    image: dxflrs/garage:v2.3.0
    container_name: zpotify-test-garage
    volumes:
      - ./tests/garage.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage/meta
      - /var/lib/garage/data
    ports:
      - "${TEST_GARAGE_PORT:-19100}:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
