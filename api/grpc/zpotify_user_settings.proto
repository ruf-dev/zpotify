syntax = "proto3";

package zpotify_api;

import "npm.proto";

option go_package = "/zpotify_api;zpotify_api";
option (npm_package) = "@zpotify/api";
option java_package = "ru.zpotify.api.grpc";
option java_multiple_files = true;

enum TorrentSearchStatus {
  TORRENT_SEARCH_STATUS_UNSPECIFIED = 0;
  TORRENT_SEARCH_STATUS_DISABLED = 1;
  TORRENT_SEARCH_STATUS_UNREACHABLE = 2;
  TORRENT_SEARCH_STATUS_AVAILABLE = 3;
}

message UserSettings {
  reserved 3;
  reserved "is_torrent_search_available";

  repeated HomePageSegment home_segments = 1;
  UiSettings ui = 2;
  TorrentSearchStatus torrent_search_status = 4;
}

message HomePageSegment {
  oneof segment {
    PlaylistSegment playlist_segment = 1;
    Management management_segment = 2;
    // TODO: Implement — include LibrarySegment in GetUserSettings response
    LibrarySegment library_segment = 3;
    FeedSegment feed_segment = 4;
  }

  message PlaylistSegment {
    string playlist_id = 1;
  }

  message Management {

  }

  message LibrarySegment {

  }

  message FeedSegment {

  }
}

message UiSettings {
  string locale = 1;
}