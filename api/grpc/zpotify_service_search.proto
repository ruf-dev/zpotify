syntax = "proto3";

package zpotify_api;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "npm.proto";
import "zpotify_common.proto";

option go_package = "/zpotify_api;zpotify_api";
option (npm_package) = "@zpotify/api";
option java_package = "ru.zpotify.api.grpc";
option java_multiple_files = true;

service SearchAPI {
  rpc Search(Search.Request) returns (Search.Response) {
    option (google.api.http) = {
      post: "/api/search"
      body: "*"
    };
  };

  rpc RecordSearchQuery(RecordSearchQuery.Request) returns (RecordSearchQuery.Response) {
    option (google.api.http) = {
      post: "/api/search/history/query"
      body: "*"
    };
  };

  rpc RecordSearchFinding(RecordSearchFinding.Request) returns (RecordSearchFinding.Response) {
    option (google.api.http) = {
      post: "/api/search/history/finding"
      body: "*"
    };
  };

  rpc ListSearchHistory(ListSearchHistory.Request) returns (ListSearchHistory.Response) {
    option (google.api.http) = {
      get: "/api/search/history"
    };
  };
}

message Search {
  message Request {
    string query = 1;
    Paging paging = 2;
    SearchFilters filters = 3;
  }

  message Response {
    repeated TrackResult tracks = 1;
    repeated ArtistResult artists = 2;
    repeated AlbumResult albums = 3;
    repeated PlaylistResult playlists = 4;
  }

  message TrackResult {
    SongBase song = 1;
    double score = 2;
    ContainerPlaylist container_playlist = 3;
  }

  message ContainerPlaylist {
    string uuid = 1;
    string name = 2;
    bool is_album = 3;
  }

  message ArtistResult {
    ArtistBase artist = 1;
    double score = 2;
  }

  message AlbumResult {
    Playlist playlist = 1;
    double score = 2;
  }

  message PlaylistResult {
    Playlist playlist = 1;
    double score = 2;
  }
}

message SearchFilters {
  // Reserved for future genre/mood facet chips (reuses AlbumTag kinds). Unused server-side in v1 — accepted but ignored.
  repeated string tags = 1;
}

message RecordSearchQuery {
  message Request {
    string query = 1;
  }

  message Response {}
}

message RecordSearchFinding {
  message Request {
    string query = 1;
    string finding_type = 2;
    string finding_id = 3;
    string finding_name = 4;
    string finding_cover_url = 5;
  }

  message Response {}
}

message ListSearchHistory {
  message Request {}

  message Response {
    repeated SearchHistoryEntry entries = 1;
  }
}

message SearchHistoryEntry {
  string query = 1;
  string finding_type = 2;
  string finding_id = 3;
  string finding_name = 4;
  string finding_cover_url = 5;
  google.protobuf.Timestamp created_at = 6;
}
