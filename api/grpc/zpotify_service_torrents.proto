syntax = "proto3";

package zpotify_api;

import "npm.proto";

import "google/protobuf/timestamp.proto";

import "google/api/annotations.proto";

option go_package = "/zpotify_api;zpotify_api";
option (npm_package) = "@zpotify/api";
option java_package = "ru.zpotify.api.grpc";
option java_multiple_files = true;

service TorrentAPI {
  rpc ListTorrentJobs(ListTorrentJobs.Request) returns (ListTorrentJobs.Response) {
    option (google.api.http) = {
      post: "/api/torrents/list"
      body: "*",
    };
  }

  rpc GetTorrentJob(GetTorrentJob.Request) returns (GetTorrentJob.Response) {
    option (google.api.http) = {
      get: "/api/torrents/{job_id}"
    };
  }

  rpc GetTorrentMagnet(GetTorrentMagnet.Request) returns (GetTorrentMagnet.Response) {
    option (google.api.http) = {
      get: "/api/torrents/{job_id}/magnet"
    };
  }

  rpc CancelTorrentJob(CancelTorrentJob.Request) returns (CancelTorrentJob.Response) {
    option (google.api.http) = {
      post: "/api/torrents/{job_id}/cancel"
    };
  }

  rpc PauseTorrentJob(PauseTorrentJob.Request) returns (PauseTorrentJob.Response) {
    option (google.api.http) = {
      post: "/api/torrents/{job_id}/pause"
    };
  }

  rpc ResumeTorrentJob(ResumeTorrentJob.Request) returns (ResumeTorrentJob.Response) {
    option (google.api.http) = {
      post: "/api/torrents/{job_id}/resume"
    };
  }

  rpc DeleteTorrentJob(DeleteTorrentJob.Request) returns (DeleteTorrentJob.Response) {
    option (google.api.http) = {
      delete: "/api/torrents/{job_id}"
    };
  }

  rpc WatchTorrentJobs(WatchTorrentJobs.Request) returns (stream WatchTorrentJobs.Response) {
    option (google.api.http) = {
      post: "/api/torrents/watch"
      body: "*"
    };
  }

  rpc GetTorrentFile(GetTorrentFile.Request) returns (GetTorrentFile.Response) {
    option (google.api.http) = {
      get: "/api/torrents/files/{id}"
    };
  }

  rpc SubmitTorrentFile(SubmitTorrentFile.Request) returns (SubmitTorrentFile.Response) {
    option (google.api.http) = {
      post: "/api/torrents/files/{id}/submit"
      body: "*"
    };
  }

  rpc AddTorrentMagnet(AddTorrentMagnet.Request) returns (AddTorrentMagnet.Response) {
    option (google.api.http) = {
      post: "/api/torrents/magnet"
      body: "*"
    };
  }

  rpc SearchTorrents(SearchTorrents.Request) returns (SearchTorrents.Response) {
    option (google.api.http) = {
      post: "/api/torrents/search"
      body: "*"
    };
  }

  rpc AddTorrentSearchResult(AddTorrentSearchResult.Request) returns (AddTorrentSearchResult.Response) {
    option (google.api.http) = {
      post: "/api/torrents/search/add"
      body: "*"
    };
  }

  rpc DiscardTorrentFile(DiscardTorrentFile.Request) returns (DiscardTorrentFile.Response) {
    option (google.api.http) = {
      post: "/api/torrents/files/{id}/discard"
      body: "*"
    };
  }
}

message TorrentJob {
  int64 id = 1;
  string torrent_name = 2;
  string folder_name = 3;
  string status = 4;
  int64 total_bytes = 5;
  int64 downloaded_bytes = 6;
  repeated ImportedFile imported_files = 7;
  string error = 8;
  repeated TorrentFileProgress files = 9;
  bool is_private = 10;
}

message ImportedFile {
  string torrent_path = 1;
  int64 file_id = 2;
  string status = 3;
  string error = 4;
  string file_path = 5;
  bool file_deleted = 6;
}

message TorrentFileProgress {
  string path = 1;
  int64 downloaded_bytes = 2;
  int64 total_bytes = 3;
}

message ListTorrentJobs {
  message Request {
    string folder_name = 1;
  }

  message Response {
    repeated TorrentJob jobs = 1;
  }
}

message GetTorrentJob {
  message Request {
    int64 job_id = 1;
  }

  message Response {
    TorrentJob job = 1;
  }
}

message GetTorrentMagnet {
  message Request {
    int64 job_id = 1;
  }

  message Response {
    string magnet_uri = 1;
  }
}

message CancelTorrentJob {
  message Request {
    int64 job_id = 1;
  }

  message Response {}
}

message PauseTorrentJob {
  message Request {
    int64 job_id = 1;
  }

  message Response {}
}

message ResumeTorrentJob {
  message Request {
    int64 job_id = 1;
  }

  message Response {}
}

message DeleteTorrentJob {
  message Request {
    int64 job_id = 1;
  }

  message Response {}
}

message WatchTorrentJobs {
  message Request {
    optional string folder_name = 1;
    optional int32 limit = 2;
  }

  message Response {
    TorrentJob job = 1;
  }
}

message TorrentFile {
  string id = 1;
  string torrent_name = 2;
  repeated TorrentFileEntry files = 3;
  // Metadata is still being fetched from peers; files is empty until it arrives.
  bool is_resolving = 4;
}

enum TorrentFileKind {
  TORRENT_FILE_KIND_UNSPECIFIED = 0;
  TORRENT_FILE_KIND_TRACK = 1;
  TORRENT_FILE_KIND_COVER = 2;
  TORRENT_FILE_KIND_OTHER = 3;
}

message TorrentFileEntry {
  string path = 1;
  int64 size_bytes = 2;
  bool supported = 3;
  TorrentFileKind kind = 4;
}

message GetTorrentFile {
  message Request {
    string id = 1;
  }

  message Response {
    TorrentFile file = 1;
  }
}

message SubmitTorrentFile {
  message Request {
    string id = 1;
    string folder_name = 2;
    repeated string selected_paths = 3;
  }

  message Response {
    int64 job_id = 1;
  }
}

message AddTorrentMagnet {
  message Request {
    string magnet_uri = 1;
  }

  message Response {
    oneof result {
      // Handle for GetTorrentFile / SubmitTorrentFile / DiscardTorrentFile.
      string upload_id = 1;
      // The caller already has an active job for this info hash.
      int64 existing_job_id = 2;
    }
  }
}

message TorrentSearchResult {
  // Opaque server-issued handle for AddTorrentSearchResult.
  string id                              = 1;
  string title                           = 2;
  int64 size_bytes                       = 3;
  string indexer                         = 4;
  google.protobuf.Timestamp published_at = 5;
  // Some user already has a non-failed, non-canceled job for this info hash.
  bool is_already_imported               = 6;
}

message SearchTorrents {
  message Request {
    string query = 1;
  }

  message Response {
    repeated TorrentSearchResult results = 1;
  }
}

message AddTorrentSearchResult {
  message Request {
    string id = 1;
  }

  message Response {
    oneof result {
      string upload_id       = 1;
      int64 existing_job_id  = 2;
    }
  }
}

message DiscardTorrentFile {
  message Request {
    string id = 1;
  }

  message Response {}
}
