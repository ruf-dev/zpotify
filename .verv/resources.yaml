- name: postgres
  type: postgres
  isolation: shared_pool
  box: medium
  binds_to: data_sources.postgres

- name: storage
  type: local_volume
  container_path: /data
  sticky: true

- name: media-server
  type: nginx
  box: small
  config:
    - media-server.conf:/etc/nginx/nginx.conf:ro
  volumes:
    - {name: storage, path: /data}
