worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;

    types {
        # Audio
        audio/mpeg          mp3;
        audio/ogg           ogg oga;
        audio/wav           wav;
        audio/flac          flac;
        audio/aac           aac;
        audio/webm          weba;
        audio/x-m4a         m4a;

        # Images
        image/jpeg          jpg jpeg;
        image/png           png;
        image/webp          webp;
        image/gif           gif;
        image/svg+xml       svg svgz;

        # Binary / archives (force download)
        application/octet-stream    bin exe dll so a o img iso;
        application/zip             zip;
        application/gzip            gz tgz;
        application/x-tar           tar;
        application/x-bzip2         bz2;
        application/x-7z-compressed 7z;
        application/x-rar-compressed rar;
    }

    sendfile on;

    server {
        listen      8085;
        server_name localhost;

        root /data/nginx;

        autoindex on;
        autoindex_exact_size on;
        autoindex_localtime  on;

        # Audio files – inline playback + range requests for seeking
        location ~* \.(mp3|ogg|oga|wav|flac|aac|weba|m4a)$ {
            add_header Accept-Ranges bytes;
            add_header Cache-Control "no-cache";
            # Allow browser fetch() (used for offline caching) to read the response cross-origin
            add_header Access-Control-Allow-Origin *;
            error_page 404 = @remote_media;
        }

#         Image files – served from file storage root
        location ~* \.(jpg|jpeg|png|webp|gif)$ {
            add_header Cache-Control "public, max-age=86400";
            error_page 404 = @remote_media;
        }

        # File is not on the local disk: Go answers with X-Accel-Redirect: /_remote for remote storages.
        # rewrite instead of a variable proxy_pass: host.docker.internal comes from /etc/hosts, which a resolver ignores.
        location @remote_media {
            rewrite ^ /wapi/media$uri break;
            proxy_http_version 1.1;
            proxy_pass http://host.docker.internal:8087;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Remote object streamed on behalf of Go's X-Accel-Redirect answer. $upstream_http_* of the
        # redirecting response stay readable here ($sent_http_* are the headers going to the client, not these).
        location /_remote {
            internal;

            resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;

            set $remote_url  $upstream_http_x_remote_url;
            set $remote_auth $upstream_http_x_remote_authorization;

            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_method GET;
            proxy_set_header Connection "";
            proxy_set_header Host $proxy_host;
            proxy_set_header Authorization $remote_auth;
            proxy_set_header Cookie "";
            proxy_pass $remote_url;

            proxy_hide_header Set-Cookie;
            proxy_hide_header X-Amz-Request-Id;
            proxy_hide_header Accept-Ranges;
            add_header Accept-Ranges bytes;
        }

        location /wapi/ {
            client_max_body_size 200m;
            proxy_request_buffering off;
            proxy_http_version 1.1;

            proxy_read_timeout  300s;
            proxy_send_timeout  300s;

            proxy_pass http://host.docker.internal:8087;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass_request_headers on;
        }

        location /api {
            proxy_http_version 1.1;

            # TODO point to actuall backend
            proxy_pass http://host.docker.internal:8087;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_pass_request_headers on;
        }

        # Everything else – the Go service, serving the embedded UI bundle
        location / {
            proxy_pass http://host.docker.internal:8087;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}